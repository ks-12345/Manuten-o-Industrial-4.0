name: mobile
description: "A new Flutter project."
publish_to: 'none'
version: 2.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.5

  # Database local
  isar: ^3.1.0+1
  isar_flutter_libs: any

  # Gráficos
  fl_chart: ^0.67.0

  # Animações
  flutter_animate: ^4.5.0

  # Fontes e ícones
  google_fonts: ^6.2.1

  # QR Code
  mobile_scanner: ^4.0.1
  qr_flutter: ^4.1.0

  # Utilitários
  uuid: ^4.3.3
  intl: ^0.19.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.9

  # ISAR
  isar_generator: ^3.1.0+1

  # Riverpod
  riverpod_generator: ^2.4.0
  # riverpod_lint: ^2.3.10
  # custom_lint: ^0.5.11

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/